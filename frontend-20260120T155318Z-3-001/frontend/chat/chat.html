<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coach Chat | AI Gym Pro</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">

    <style>
        .chat-container {
            display: flex;
            height: calc(100vh - 120px);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .chat-sidebar {
            width: 300px;
            border-right: 1px solid var(--border-subtle);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.01);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            background: var(--primary);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 25px;
            padding: 12px 20px;
            color: var(--text-main);
            outline: none;
            transition: var(--trans-fast);
        }

        .chat-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--trans-fast);
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-glow);
        }

        .conversation-item {
            padding: 15px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: var(--trans-fast);
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: rgba(255, 255, 255, 0.05);
        }

        .conversation-item h4 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .conversation-item p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-dumbbell"></i>
                    <span>AI Gym Pro</span>
                </div>
            </div>

            <nav class="nav-links">
                <a href="../index.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="../habit.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Habit Tracker</span>
                </a>
                <a href="chat.html" class="nav-item active">
                    <i class="fas fa-robot"></i>
                    <span>AI Coach</span>
                </a>
                <a href="../vision/pose.html" class="nav-item">
                    <i class="fas fa-camera"></i>
                    <span>Pose Analysis</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-mini-profile">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info-mini">
                        <h4>My Profile</h4>
                        <p>Settings</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header -->
            <header class="top-header">
                <div class="page-title">
                    <h2>AI Coach</h2>
                </div>
            </header>

            <!-- Content -->
            <main class="content-area">

                <div class="chat-container">
                    <!-- Chat Sidebar (History) -->
                    <div class="chat-sidebar">
                        <div style="padding: 20px; border-bottom: 1px solid var(--border-subtle);">
                            <button class="btn btn-secondary" style="width: 100%; font-size: 0.9rem;">
                                <i class="fas fa-plus"></i> New Chat
                            </button>
                        </div>
                        <div style="overflow-y: auto;">
                            <div class="conversation-item active">
                                <h4>Workout Plan</h4>
                                <p>Can you make a 3-day split?</p>
                            </div>
                            <div class="conversation-item">
                                <h4>Diet Advice</h4>
                                <p>What should I eat before...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Chat Main -->
                    <div class="chat-main">
                        <div class="chat-messages" id="chat-messages">
                            <div class="message ai">
                                Hello! I'm your AI fitness coach. How can I help you today?
                            </div>
                        </div>

                        <div class="chat-input-area">
                            <button class="btn-icon text-muted"><i class="fas fa-paperclip"></i></button>
                            <input type="text" class="chat-input" id="chat-input"
                                placeholder="Ask about workouts, diet, or form...">
                            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="chat.js"></script>
    <script>
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            const text = input.value.trim();

            if (text) {
                // User Message
                const userMsg = document.createElement('div');
                userMsg.className = 'message user';
                userMsg.textContent = text;
                messages.appendChild(userMsg);

                input.value = '';
                messages.scrollTop = messages.scrollHeight;

                // Simulate AI Response
                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message ai';
                    aiMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    messages.appendChild(aiMsg);
                    messages.scrollTop = messages.scrollHeight;

                    setTimeout(() => {
                        aiMsg.textContent = "That's a great question! Based on your goals, I'd recommend focusing on compound movements like squats and deadlifts.";
                    }, 1500);
                }, 500);
            }
        }

        // Allow Enter key to send
        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
